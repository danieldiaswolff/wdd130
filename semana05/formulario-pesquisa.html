<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | Formulário HTML - Enquete do Usuário</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>
    <header>
        <h1>WDD 130 | Formulário HTML - Enquete do Usuário</h1>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Informações de Contato</legend>
                <div class="item-formulario coluna2">
                    <label for="nome-completo">Nome Completo: </label>
                    <input type="text" id="nome-completo" name="nome-completo" required placeholder="Nome Completo">
                </div>
                <div class="item-formulario coluna2">
                    <label for="email-do-usuario">Email: </label>
                    <input type="email" id="email-do-usuario" name="email-do-usuario" required
                        placeholder="email@exemplo.com">
                </div>
            </fieldset>

            <fieldset>
                <legend>Perguntas</legend>
                <div class="item-formulario coluna1">
                    <label for="navegador">Qual é o seu navegador de internet favorito?</label>
                    <select name="navegador" id="navegador">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
                <div class="item-formulario coluna1">
                    <label for="pet">Você tem um animal de estimação? </label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <label class="feedback-label" for="feedback">Liste os lugares onde você morou:</label>
                <textarea name="feedback" id="feedback" rows="4"
                    placeholder="Exemplo: Joinville, Florianópolis, etc."></textarea>
            </fieldset>

            <button type="submit">Enviar Pesquisa</button>
        </form>
    </main>

    <footer>
        <p>©2026 | Formulário HTML - Atividade de Enquete do Usuário | Daniel Dias Wolff</p>
    </footer>
</body>

</html>
